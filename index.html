<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사회 교과서 어휘 학습 — 다국어 지원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEAE0;
    --paper-2:#F7F4EC;
    --navy:#1B3358;
    --navy-deep:#122238;
    --amber:#C9862B;
    --amber-deep:#A66A1C;
    --sage:#6E8F73;
    --sage-deep:#55705A;
    --brass:#B4863A;
    --ink:#22242A;
    --ink-soft:#5B5A52;
    --line:#DAD3C2;
    --card:#FFFFFF;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR','Noto Sans',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  [lang="zh"]{font-family:'Noto Sans SC','Noto Sans KR',sans-serif;}
  [lang="ru"]{font-family:'Noto Sans','Noto Sans KR',sans-serif;}

  ::selection{background:var(--amber);color:#fff;}

  header.site{
    padding:38px 6vw 26px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--paper-2),var(--paper));
  }
  .eyebrow-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .badge-dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--amber);
    flex:none;
  }
  .kicker{
    font-size:13px;
    letter-spacing:.02em;
    color:var(--ink-soft);
  }
  h1.title{
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    font-size:clamp(26px,3.4vw,40px);
    margin:0 0 10px;
    color:var(--navy-deep);
    line-height:1.25;
  }
  p.lede{
    max-width:640px;
    margin:0;
    font-size:15.5px;
    line-height:1.65;
    color:var(--ink-soft);
  }

  main{
    padding:34px 6vw 80px;
    max-width:1180px;
    margin:0 auto;
  }

  /* ---------- GRID VIEW ---------- */
  #gridView{}

  .grid-heading{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:8px;
  }
  .grid-heading h2{
    font-family:'Noto Serif KR',serif;
    font-size:19px;
    margin:0;
    color:var(--navy-deep);
  }
  .grid-count{
    font-size:13px;
    color:var(--ink-soft);
  }

  .vocab-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
  }
  @media (max-width:820px){
    .vocab-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:520px){
    .vocab-grid{grid-template-columns:1fr;}
    header.site{padding:28px 5vw 22px;}
    main{padding:24px 5vw 60px;}
  }

  .vocab-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:14px;
    text-align:left;
    transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    box-shadow:0 1px 0 rgba(27,51,88,.02);
  }
  .vocab-card:hover{
    transform:translateY(-2px);
    border-color:var(--navy);
    box-shadow:0 10px 24px -14px rgba(27,51,88,.35);
  }
  .vocab-card:focus-visible{
    outline:2px solid var(--navy);
    outline-offset:2px;
  }
  .card-icon{
    flex:none;
    width:44px;height:44px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .card-icon svg{width:22px;height:22px;}
  .card-word{
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    font-size:17px;
    color:var(--navy-deep);
    line-height:1.35;
  }
  .card-num{
    font-size:11px;
    color:var(--ink-soft);
    display:block;
    margin-bottom:2px;
  }

  /* color variants */
  .c-navy{background:var(--navy);color:#fff;}
  .c-amber{background:var(--amber);color:#fff;}
  .c-sage{background:var(--sage);color:#fff;}
  .c-brass{background:var(--brass);color:#fff;}

  /* ---------- DETAIL VIEW ---------- */
  #detailView{display:none;}

  .detail-topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    margin-bottom:22px;
  }
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:none;
    border:1px solid var(--line);
    color:var(--navy-deep);
    font-size:14px;
    font-weight:500;
    padding:9px 16px 9px 12px;
    border-radius:999px;
    cursor:pointer;
    font-family:inherit;
    transition:background .15s ease,border-color .15s ease;
  }
  .back-btn:hover{background:var(--paper-2);border-color:var(--navy);}

  .flags{
    display:flex;
    gap:8px;
    opacity:0;
    transform:translateY(-6px);
    pointer-events:none;
    transition:opacity .45s ease, transform .45s ease;
  }
  .flags.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .flag-btn{
    width:46px;height:46px;
    border-radius:50%;
    border:2px solid var(--card);
    background:var(--card);
    cursor:pointer;
    padding:0;
    overflow:hidden;
    box-shadow:0 4px 14px -6px rgba(27,51,88,.4);
    transition:transform .15s ease, border-color .15s ease;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    line-height:1;
  }
  .flag-btn:hover{transform:translateY(-2px) scale(1.05);}
  .flag-btn.active{border-color:var(--amber);}
  .flag-btn:focus-visible{outline:2px solid var(--navy);outline-offset:2px;}

  .detail-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    padding:clamp(28px,4vw,56px);
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:26px;
    min-height:60vh;
    justify-content:center;
  }

  .lang-tag{
    font-size:12.5px;
    letter-spacing:.02em;
    color:var(--ink-soft);
    border:1px solid var(--line);
    padding:5px 14px;
    border-radius:999px;
  }

  .detail-word{
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    font-size:clamp(32px,5vw,56px);
    color:var(--navy-deep);
    line-height:1.2;
    margin:0;
  }
  .detail-word .ko-sub{
    display:block;
    font-family:'Noto Sans KR',sans-serif;
    font-weight:500;
    font-size:16px;
    color:var(--ink-soft);
    margin-top:8px;
  }

  .detail-image{
    width:150px;height:150px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .detail-image svg{width:76px;height:76px;}

  .detail-desc{
    max-width:560px;
    font-size:clamp(16px,2vw,19px);
    line-height:1.75;
    color:var(--ink);
    margin:0;
  }

  .replay-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--navy);
    color:#fff;
    border:none;
    font-size:14px;
    font-weight:500;
    padding:11px 20px;
    border-radius:999px;
    cursor:pointer;
    font-family:inherit;
    transition:background .15s ease, transform .15s ease;
  }
  .replay-btn:hover{background:var(--navy-deep);transform:translateY(-1px);}
  .replay-btn:disabled{opacity:.5;cursor:default;transform:none;}

  .speaking-note{
    font-size:12.5px;
    color:var(--ink-soft);
    min-height:16px;
  }

  .nav-row{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .nav-arrow{
    background:none;
    border:1px solid var(--line);
    color:var(--navy-deep);
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    font-family:inherit;
    font-size:13.5px;
    transition:background .15s ease,border-color .15s ease;
  }
  .nav-arrow:hover{background:var(--paper-2);border-color:var(--navy);}
  .nav-arrow:disabled{opacity:.4;cursor:default;}

  .no-speech-note{
    font-size:12.5px;
    color:var(--amber-deep);
    background:#FBF1E2;
    border:1px solid #EFD9AE;
    padding:8px 14px;
    border-radius:10px;
    display:none;
  }

  footer.site{
    padding:22px 6vw 40px;
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<header class="site">
  <div class="eyebrow-row">
    <span class="badge-dot"></span>
    <span class="kicker">초등 사회 · 정치와 선거 어휘 학습</span>
  </div>
  <h1 class="title">사회 교과서 어휘 학습</h1>
  <p class="lede">한자어 개념 때문에 어렵게 느껴지는 사회 어휘를, 그림과 소리로 쉽게 배워요. 한국어를 잘 모르는 친구들도 함께 배울 수 있도록 영어·러시아어·중국어를 지원합니다.</p>
</header>

<main>

  <!-- ===== GRID VIEW ===== -->
  <section id="gridView">
    <div class="grid-heading">
      <h2>목표 어휘 4개</h2>
      <span class="grid-count">단어를 눌러 뜻과 그림, 발음을 확인하세요</span>
    </div>
    <div class="vocab-grid" id="vocabGrid"></div>
  </section>

  <!-- ===== DETAIL VIEW ===== -->
  <section id="detailView">
    <div class="detail-topbar">
      <button class="back-btn" id="backBtn" aria-label="목록으로 돌아가기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        목록으로
      </button>
      <div class="flags" id="flagRow">
        <button class="flag-btn" data-lang="ko" aria-label="한국어" title="한국어">🇰🇷</button>
        <button class="flag-btn" data-lang="en" aria-label="English" title="English">🇺🇸</button>
        <button class="flag-btn" data-lang="ru" aria-label="Русский" title="Русский">🇷🇺</button>
        <button class="flag-btn" data-lang="zh" aria-label="中文" title="中文">🇨🇳</button>
      </div>
    </div>

    <div class="detail-card">
      <span class="lang-tag" id="langTag">한국어</span>

      <div class="detail-image" id="detailImage"></div>

      <h3 class="detail-word" id="detailWord" lang="ko"></h3>

      <p class="detail-desc" id="detailDesc" lang="ko"></p>

      <div>
        <button class="replay-btn" id="replayBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>
          <span id="replayLabel">다시 듣기</span>
        </button>
      </div>
      <p class="speaking-note" id="speakingNote"></p>
      <p class="no-speech-note" id="noSpeechNote">이 브라우저는 음성 재생을 지원하지 않아요. 텍스트로 뜻을 확인해 주세요.</p>

      <div class="nav-row">
        <button class="nav-arrow" id="prevBtn">← 이전 단어</button>
        <button class="nav-arrow" id="nextBtn">다음 단어 →</button>
      </div>
    </div>
  </section>

</main>

<footer class="site">국립국어원·다문화 학습 지원을 위한 사회과 어휘 학습 사이트 · 첨부 어휘 자료 기반 자동 생성</footer>

    var card = document.createElement('button');
    card.className = 'vocab-card';
    card.setAttribute('data-idx', idx);
    card.innerHTML =
      '<span class="card-icon c-'+meta.color+'">'+iconSvg(meta.icon)+'</span>'+
      '<span><span class="card-num">'+(idx+1)+'</span><span class="card-word">'+item.ko.word+'</span></span>';
    card.addEventListener('click', function(){ openDetail(idx); });
    gridEl.appendChild(card);
  });

  // ---------- View switching ----------
  var gridView = document.getElementById('gridView');
  var detailView = document.getElementById('detailView');
  var currentIdx = 0;
  var currentLang = 'ko';

  function openDetail(idx){
    currentIdx = idx;
    currentLang = 'ko';
    gridView.style.display = 'none';
    detailView.style.display = 'block';
    window.scrollTo({top:0, behavior:'smooth'});
    renderDetail(true);
  }

  document.getElementById('backBtn').addEventListener('click', function(){
    stopSpeech();
    detailView.style.display = 'none';
    gridView.style.display = 'block';
  });

  document.getElementById('prevBtn').addEventListener('click', function(){
    currentIdx = (currentIdx - 1 + VOCAB.length) % VOCAB.length;
    currentLang = 'ko';
    renderDetail(true);
  });
  document.getElementById('nextBtn').addEventListener('click', function(){
    currentIdx = (currentIdx + 1) % VOCAB.length;
    currentLang = 'ko';
    renderDetail(true);
  });

  // ---------- Speech synthesis ----------
  var speechSupported = ('speechSynthesis' in window);
  var voicesCache = [];
  function loadVoices(){
    if(!speechSupported) return;
    voicesCache = window.speechSynthesis.getVoices();
  }
  if(speechSupported){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  } else {
    document.getElementById('noSpeechNote').style.display = 'block';
  }

  function pickVoice(langCode){
    if(!voicesCache || !voicesCache.length) return null;
    var exact = voicesCache.filter(function(v){ return v.lang === langCode; });
    if(exact.length) return exact[0];
    var prefix = langCode.split('-')[0];
    var loose = voicesCache.filter(function(v){ return v.lang && v.lang.indexOf(prefix) === 0; });
    if(loose.length) return loose[0];
    return null;
  }

  function stopSpeech(){
    if(speechSupported) window.speechSynthesis.cancel();
    document.getElementById('speakingNote').textContent = '';
  }

  function speak(text, langCode, onDone){
    if(!speechSupported){ onDone && onDone(); return; }
    window.speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = langCode;
    var v = pickVoice(langCode);
    if(v) utter.voice = v;
    utter.rate = 0.92;
    utter.pitch = 1;
    var note = document.getElementById('speakingNote');
    note.textContent = '🔊 음성 재생 중…';
    utter.onend = function(){ note.textContent = ''; onDone && onDone(); };
    utter.onerror = function(){ note.textContent = ''; onDone && onDone(); };
    window.speechSynthesis.speak(utter);
  }

  // ---------- Render detail ----------
  var flagRow = document.getElementById('flagRow');
  var langTag = document.getElementById('langTag');
  var detailImage = document.getElementById('detailImage');
  var detailWord = document.getElementById('detailWord');
  var detailDesc = document.getElementById('detailDesc');
  var replayBtn = document.getElementById('replayBtn');

  Array.prototype.forEach.call(flagRow.querySelectorAll('.flag-btn'), function(btn){
    btn.addEventListener('click', function(){
      currentLang = btn.getAttribute('data-lang');
      renderDetail(false);
    });
  });

  replayBtn.addEventListener('click', function(){
    var item = VOCAB[currentIdx];
    var langData = item[currentLang];
    var meta = LANG_META[currentLang];
    speak(langData.word + '. ' + langData.desc, meta.code);
  });

  function setActiveFlag(){
    Array.prototype.forEach.call(flagRow.querySelectorAll('.flag-btn'), function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === currentLang);
    });
  }

  function renderDetail(autoPlayKoreanThenReveal){
    var item = VOCAB[currentIdx];
    var meta = ASSIGN[currentIdx] || {icon:'speech', color:'navy'};
    var langData = item[currentLang];
    var langMeta = LANG_META[currentLang];

    detailImage.className = 'detail-image c-' + meta.color;
    detailImage.innerHTML = iconSvg(meta.icon);

    detailWord.setAttribute('lang', currentLang === 'zh' ? 'zh' : (currentLang === 'ru' ? 'ru' : (currentLang === 'en' ? 'en' : 'ko')));
    detailDesc.setAttribute('lang', detailWord.getAttribute('lang'));

    langTag.textContent = (currentIdx+1) + ' / ' + VOCAB.length + ' · ' + langMeta.label;

    if(currentLang === 'ko'){
      detailWord.innerHTML = langData.word;
    } else {
      detailWord.innerHTML = langData.word + '<span class="ko-sub">' + item.ko.word + '</span>';
    }
    detailDesc.textContent = langData.desc;

    setActiveFlag();

    if(autoPlayKoreanThenReveal){
      flagRow.classList.remove('show');
      speak(item.ko.word + '. ' + item.ko.desc, LANG_META.ko.code, function(){
        flagRow.classList.add('show');
      });
    } else {
      // language already unlocked; just play requested language, keep flags visible
      flagRow.classList.add('show');
      speak(langData.word + '. ' + langData.desc, langMeta.code);
    }
  }

})();
</script>
</body>
</html>
