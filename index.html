<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사회 교과서 어휘 학습 — 다국어 지원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEAE0;
    --paper-2:#F7F4EC;
    --navy:#1B3358;
    --navy-deep:#122238;
    --amber:#C9862B;
    --amber-deep:#A66A1C;
    --sage:#6E8F73;
    --brass:#B4863A;
    --ink:#22242A;
    --ink-soft:#5B5A52;
    --line:#DAD3C2;
    --card:#FFFFFF;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR','Noto Sans',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  [lang="zh"]{font-family:'Noto Sans SC','Noto Sans KR',sans-serif;}
  [lang="ru"]{font-family:'Noto Sans','Noto Sans KR',sans-serif;}
  ::selection{background:var(--amber);color:#fff;}

  header.site{
    padding:38px 6vw 26px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--paper-2),var(--paper));
  }
  .eyebrow-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .badge-dot{width:9px;height:9px;border-radius:50%;background:var(--amber);flex:none;}
  .kicker{font-size:13px;letter-spacing:.02em;color:var(--ink-soft);}
  h1.title{
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    font-size:clamp(26px,3.4vw,40px);
    margin:0 0 10px;
    color:var(--navy-deep);
    line-height:1.25;
  }
  p.lede{max-width:640px;margin:0;font-size:15.5px;line-height:1.65;color:var(--ink-soft);}

  main{padding:34px 6vw 80px;max-width:1180px;margin:0 auto;}

  /* ---------- GRID VIEW ---------- */
  .grid-heading{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;flex-wrap:wrap;gap:8px;}
  .grid-heading h2{font-family:'Noto Serif KR',serif;font-size:19px;margin:0;color:var(--navy-deep);}
  .grid-count{font-size:13px;color:var(--ink-soft);}

  .vocab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media (max-width:820px){.vocab-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){
    .vocab-grid{grid-template-columns:1fr;}
    header.site{padding:28px 5vw 22px;}
    main{padding:24px 5vw 60px;}
  }

  .vocab-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:14px;
    text-align:left;
    transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    box-shadow:0 1px 0 rgba(27,51,88,.02);
  }
  .vocab-card:hover{
    transform:translateY(-2px);
    border-color:var(--navy);
    box-shadow:0 10px 24px -14px rgba(27,51,88,.35);
  }
  .vocab-card:focus-visible{outline:2px solid var(--navy);outline-offset:2px;}
  .card-thumb{
    flex:none;
    width:56px;height:56px;
    border-radius:14px;
    object-fit:cover;
    background:var(--paper-2);
    border:1px solid var(--line);
  }
  .card-word{font-family:'Noto Serif KR',serif;font-weight:700;font-size:17px;color:var(--navy-deep);line-height:1.35;}
  .card-num{font-size:11px;color:var(--ink-soft);display:block;margin-bottom:2px;}

  /* ---------- DETAIL VIEW ---------- */
  #detailView{display:none;}
  .detail-topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;}
  .back-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:none;border:1px solid var(--line);color:var(--navy-deep);
    font-size:14px;font-weight:500;padding:9px 16px 9px 12px;border-radius:999px;
    cursor:pointer;font-family:inherit;transition:background .15s ease,border-color .15s ease;
  }
  .back-btn:hover{background:var(--paper-2);border-color:var(--navy);}

  .flags{display:flex;gap:8px;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .45s ease, transform .45s ease;}
  .flags.show{opacity:1;transform:translateY(0);pointer-events:auto;}
  .flag-btn{
    width:46px;height:46px;border-radius:50%;border:2px solid var(--card);background:var(--card);
    cursor:pointer;padding:0;overflow:hidden;box-shadow:0 4px 14px -6px rgba(27,51,88,.4);
    transition:transform .15s ease, border-color .15s ease;
    display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;
  }
  .flag-btn:hover{transform:translateY(-2px) scale(1.05);}
  .flag-btn.active{border-color:var(--amber);}
  .flag-btn:focus-visible{outline:2px solid var(--navy);outline-offset:2px;}

  .detail-card{
    background:var(--card);border:1px solid var(--line);border-radius:24px;
    padding:clamp(28px,4vw,56px);
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:24px;
    min-height:60vh;justify-content:center;
  }
  .lang-tag{font-size:12.5px;letter-spacing:.02em;color:var(--ink-soft);border:1px solid var(--line);padding:5px 14px;border-radius:999px;}

  .detail-word{
    font-family:'Noto Serif KR',serif;font-weight:700;
    font-size:clamp(30px,4.6vw,50px);color:var(--navy-deep);line-height:1.2;margin:0;
  }
  .detail-word .ko-sub{
    display:block;font-family:'Noto Sans KR',sans-serif;font-weight:500;
    font-size:16px;color:var(--ink-soft);margin-top:8px;
  }

  .detail-image-wrap{
    width:min(420px, 80vw);
    border-radius:20px;
    overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 18px 40px -22px rgba(27,51,88,.4);
  }
  .detail-image-wrap img{width:100%;display:block;aspect-ratio:16/10;object-fit:cover;}

  .detail-desc{max-width:560px;font-size:clamp(16px,2vw,19px);line-height:1.75;color:var(--ink);margin:0;}

  .replay-btn{
    display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border:none;
    font-size:14px;font-weight:500;padding:11px 20px;border-radius:999px;cursor:pointer;font-family:inherit;
    transition:background .15s ease, transform .15s ease;
  }
  .replay-btn:hover{background:var(--navy-deep);transform:translateY(-1px);}
  .replay-btn:disabled{opacity:.5;cursor:default;transform:none;}

  .speaking-note{font-size:12.5px;color:var(--ink-soft);min-height:16px;}

  .nav-row{display:flex;gap:10px;margin-top:2px;}
  .nav-arrow{
    background:none;border:1px solid var(--line);color:var(--navy-deep);padding:8px 16px;
    border-radius:999px;cursor:pointer;font-family:inherit;font-size:13.5px;
    transition:background .15s ease,border-color .15s ease;
  }
  .nav-arrow:hover{background:var(--paper-2);border-color:var(--navy);}

  footer.site{padding:22px 6vw 40px;text-align:center;font-size:12.5px;color:var(--ink-soft);}

  @media (prefers-reduced-motion: reduce){*{transition:none !important;}}
</style>
</head>
<body>

<header class="site">
  <div class="eyebrow-row">
    <span class="badge-dot"></span>
    <span class="kicker">초등 사회 · 정치와 선거 어휘 학습</span>
  </div>
  <h1 class="title">사회 교과서 어휘 학습</h1>
  <p class="lede">한자어 개념 때문에 어렵게 느껴지는 사회 어휘를, 그림과 소리로 쉽게 배워요. 한국어를 잘 모르는 친구들도 함께 배울 수 있도록 영어·러시아어·중국어를 지원합니다.</p>
</header>

<main>
  <section id="gridView">
    <div class="grid-heading">
      <h2>목표 어휘 4개</h2>
      <span class="grid-count">단어를 눌러 뜻과 그림, 설명 음성을 확인하세요</span>
    </div>
    <div class="vocab-grid" id="vocabGrid"></div>
  </section>

  <section id="detailView">
    <div class="detail-topbar">
      <button class="back-btn" id="backBtn" aria-label="목록으로 돌아가기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        목록으로
      </button>
      <div class="flags" id="flagRow">
        <button class="flag-btn" data-lang="ko" aria-label="한국어" title="한국어">🇰🇷</button>
        <button class="flag-btn" data-lang="en" aria-label="English" title="English">🇺🇸</button>
        <button class="flag-btn" data-lang="ru" aria-label="Русский" title="Русский">🇷🇺</button>
        <button class="flag-btn" data-lang="zh" aria-label="中文" title="中文">🇨🇳</button>
      </div>
    </div>

    <div class="detail-card">
      <span class="lang-tag" id="langTag">한국어</span>

      <div class="detail-image-wrap">
        <img id="detailImage" alt="">
      </div>

      <h3 class="detail-word" id="detailWord" lang="ko"></h3>

      <p class="detail-desc" id="detailDesc" lang="ko"></p>

      <div>
        <button class="replay-btn" id="replayBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>
          <span id="replayLabel">다시 듣기</span>
        </button>
      </div>
      <p class="speaking-note" id="speakingNote"></p>

      <div class="nav-row">
        <button class="nav-arrow" id="prevBtn">← 이전 단어</button>
        <button class="nav-arrow" id="nextBtn">다음 단어 →</button>
      </div>
    </div>
  </section>
</main>

<footer class="site">다문화 학습 지원을 위한 사회과 어휘 학습 사이트</footer>

<!-- 오디오(설명 영상의 소리만 재생하는 숨김 video) -->
<video id="narration" playsinline preload="auto" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;"></video>

<script>
(function(){
  "use strict";

  var VOCAB = [
    {
      id:'democracy',
      image:'assets/images/democracy.png',
      ko:{word:'민주주의', desc:'어떤 한 사람이 마음대로 결정하는 것이 아니라, 나라의 주인인 국민이 함께 뜻을 모아 나라를 다스리는 방식입니다.'},
      en:{word:'Democracy', desc:'A way of ruling the country where the people, as masters, gather their thoughts together instead of one person making decisions arbitrarily.'},
      ru:{word:'Демократия', desc:'Способ управления страной, при котором народ как хозяин принимает решения вместе, а не один человек по своему усмотрению.'},
      zh:{word:'民主主义', desc:'不是由某个人随心所欲地做决定，而是由作为国家主人的国民共同集思广益来治理国家的方式。'},
      audio:{ko:'assets/audio/democracy_ko.mp4', en:'assets/audio/democracy_en.mp4', ru:'assets/audio/democracy_ru.mp4', zh:'assets/audio/democracy_zh.mp4'}
    },
    {
      id:'policy_reflection',
      image:'assets/images/policy_reflection.png',
      ko:{word:'정책 반영', desc:'우리들의 생각이나 요구가 나라나 학교의 실제 계획(정책) 속에 쏙 들어가는 것입니다.'},
      en:{word:'Policy Reflection', desc:'It means our thoughts or needs are actually included in the real plans (policies) of the country or school.'},
      ru:{word:'Отражение в политике', desc:'Это означает, что наши мысли или потребности реально включаются в планы (политику) страны или школы.'},
      zh:{word:'政策反映', desc:'指我们的想法或要求真正被纳入国家或学校的实际计划（政策）之中。'},
      audio:{ko:'assets/audio/policy_reflection_ko.mp4', en:'assets/audio/policy_reflection_en.mp4', ru:'assets/audio/policy_reflection_ru.mp4', zh:'assets/audio/policy_reflection_zh.mp4'}
    },
    {
      id:'politics',
      image:'assets/images/politics.png',
      ko:{word:'정치', desc:'사회 구성원 간의 대립과 갈등을 조정하여 문제를 해결하는 모든 과정입니다.'},
      en:{word:'Politics', desc:'Politics is the entire process of resolving problems by mediating confrontations and conflicts among members of society.'},
      ru:{word:'Политика', desc:'это весь процесс решения проблем путём регулирования противостояний и конфликтов между членами общества.'},
      zh:{word:'政治', desc:'政治是调解社会成员之间的对立与冲突，并解决问题的全过程。'},
      audio:{ko:'assets/audio/politics_ko.mp4', en:'assets/audio/politics_en.mp4', ru:'assets/audio/politics_ru.mp4', zh:'assets/audio/politics_zh.mp4'}
    },
    {
      id:'policy',
      image:'assets/images/policy.png',
      ko:{word:'정책', desc:'사람들이 더 안전하고 행복하게 살 수 있도록, 나라나 지역 사회가 어떤 문제를 해결하기 위해 세우는 계획입니다.'},
      en:{word:'Policy', desc:'A plan established by the country or a local community to solve a problem so that people can live more safely and happily.'},
      ru:{word:'Политика (курс)', desc:'План, разработанный страной или местным сообществом для решения проблемы, чтобы люди могли жить безопаснее и счастливее.'},
      zh:{word:'政策', desc:'为了让人们生活得更安全、更幸福，国家或地方社会为解决某个问题而制定的计划。'},
      audio:{ko:'assets/audio/policy_ko.mp4', en:'assets/audio/policy_en.mp4', ru:'assets/audio/policy_ru.mp4', zh:'assets/audio/policy_zh.mp4'}
    }
  ];

  var LANG_META = {
    ko:{label:'한국어'}, en:{label:'English'}, ru:{label:'Русский'}, zh:{label:'中文'}
  };

  // ---------- Build grid ----------
  var gridEl = document.getElementById('vocabGrid');
  VOCAB.forEach(function(item, idx){
    var card = document.createElement('button');
    card.className = 'vocab-card';
    card.innerHTML =
      '<img class="card-thumb" src="'+item.image+'" alt="">'+
      '<span><span class="card-num">'+(idx+1)+'</span><span class="card-word">'+item.ko.word+'</span></span>';
    card.addEventListener('click', function(){ openDetail(idx); });
    gridEl.appendChild(card);
  });

  // ---------- View switching ----------
  var gridView = document.getElementById('gridView');
  var detailView = document.getElementById('detailView');
  var currentIdx = 0;
  var currentLang = 'ko';
  var narrationEl = document.getElementById('narration');

  function openDetail(idx){
    currentIdx = idx;
    currentLang = 'ko';
    gridView.style.display = 'none';
    detailView.style.display = 'block';
    window.scrollTo({top:0, behavior:'smooth'});
    renderDetail(true);
  }

  document.getElementById('backBtn').addEventListener('click', function(){
    stopNarration();
    detailView.style.display = 'none';
    gridView.style.display = 'block';
  });

  document.getElementById('prevBtn').addEventListener('click', function(){
    currentIdx = (currentIdx - 1 + VOCAB.length) % VOCAB.length;
    currentLang = 'ko';
    renderDetail(true);
  });
  document.getElementById('nextBtn').addEventListener('click', function(){
    currentIdx = (currentIdx + 1) % VOCAB.length;
    currentLang = 'ko';
    renderDetail(true);
  });

  // ---------- Narration playback (hidden video = audio source) ----------
  function stopNarration(){
    narrationEl.pause();
    narrationEl.onended = null;
    document.getElementById('speakingNote').textContent = '';
  }

  function playNarration(src, onDone){
    stopNarration();
    narrationEl.src = src;
    var note = document.getElementById('speakingNote');
    note.textContent = '🔊 설명 음성 재생 중…';
    narrationEl.onended = function(){
      note.textContent = '';
      onDone && onDone();
    };
    narrationEl.onerror = function(){
      note.textContent = '음성을 불러올 수 없어요.';
      onDone && onDone();
    };
    var p = narrationEl.play();
    if(p && p.catch){
      p.catch(function(){
        note.textContent = '재생 버튼을 눌러 음성을 들어보세요.';
        onDone && onDone();
      });
    }
  }

  // ---------- Render detail ----------
  var flagRow = document.getElementById('flagRow');
  var langTag = document.getElementById('langTag');
  var detailImage = document.getElementById('detailImage');
  var detailWord = document.getElementById('detailWord');
  var detailDesc = document.getElementById('detailDesc');
  var replayBtn = document.getElementById('replayBtn');

  Array.prototype.forEach.call(flagRow.querySelectorAll('.flag-btn'), function(btn){
    btn.addEventListener('click', function(){
      currentLang = btn.getAttribute('data-lang');
      renderDetail(false);
    });
  });

  replayBtn.addEventListener('click', function(){
    var item = VOCAB[currentIdx];
    playNarration(item.audio[currentLang]);
  });

  function setActiveFlag(){
    Array.prototype.forEach.call(flagRow.querySelectorAll('.flag-btn'), function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === currentLang);
    });
  }

  function renderDetail(autoPlayKoreanThenReveal){
    var item = VOCAB[currentIdx];
    var langData = item[currentLang];
    var langMeta = LANG_META[currentLang];

    detailImage.src = item.image;
    detailImage.alt = item.ko.word;

    var htmlLang = currentLang === 'zh' ? 'zh' : (currentLang === 'ru' ? 'ru' : (currentLang === 'en' ? 'en' : 'ko'));
    detailWord.setAttribute('lang', htmlLang);
    detailDesc.setAttribute('lang', htmlLang);

    langTag.textContent = (currentIdx+1) + ' / ' + VOCAB.length + ' · ' + langMeta.label;

    if(currentLang === 'ko'){
      detailWord.innerHTML = langData.word;
    } else {
      detailWord.innerHTML = langData.word + '<span class="ko-sub">' + item.ko.word + '</span>';
    }
    detailDesc.textContent = langData.desc;

    setActiveFlag();

    if(autoPlayKoreanThenReveal){
      flagRow.classList.remove('show');
      playNarration(item.audio.ko, function(){
        flagRow.classList.add('show');
      });
    } else {
      flagRow.classList.add('show');
      playNarration(item.audio[currentLang]);
    }
  }

})();
</script>
</body>
</html>
