<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사회 교과서 어휘 학습 — 다국어 지원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEAE0;
    --paper-2:#F7F4EC;
    --navy:#1B3358;
    --navy-deep:#122238;
    --amber:#C9862B;
    --amber-deep:#A66A1C;
    --sage:#6E8F73;
    --sage-deep:#55705A;
    --brass:#B4863A;
    --ink:#22242A;
    --ink-soft:#5B5A52;
    --line:#DAD3C2;
    --card:#FFFFFF;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR','Noto Sans',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  [lang="zh"]{font-family:'Noto Sans SC','Noto Sans KR',sans-serif;}
  [lang="ru"]{font-family:'Noto Sans','Noto Sans KR',sans-serif;}

  ::selection{background:var(--amber);color:#fff;}

  header.site{
    padding:38px 6vw 26px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--paper-2),var(--paper));
  }
  .eyebrow-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .badge-dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--amber);
    flex:none;
  }
  .kicker{
    font-size:13px;
    letter-spacing:.02em;
    color:var(--ink-soft);
  }
  h1.title{
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    font-size:clamp(26px,3.4vw,40px);
    margin:0 0 10px;
    color:var(--navy-deep);
    line-height:1.25;
  }
  p.lede{
    max-width:640px;
    margin:0;
    font-size:15.5px;
    line-height:1.65;
    color:var(--ink-soft);
  }

  main{
    padding:34px 6vw 80px;
    max-width:1180px;
    margin:0 auto;
  }

  /* ---------- GRID VIEW ---------- */
  #gridView{}

  .grid-heading{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:8px;
  }
  .grid-heading h2{
    font-family:'Noto Serif KR',serif;
    font-size:19px;
    margin:0;
    color:var(--navy-deep);
  }
  .grid-count{
    font-size:13px;
    color:var(--ink-soft);
  }

  .vocab-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
  }
  @media (max-width:820px){
    .vocab-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:520px){
    .vocab-grid{grid-template-columns:1fr;}
    header.site{padding:28px 5vw 22px;}
    main{padding:24px 5vw 60px;}
  }

  .vocab-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:14px;
    text-align:left;
    transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    box-shadow:0 1px 0 rgba(27,51,88,.02);
  }
  .vocab-card:hover{
    transform:translateY(-2px);
    border-color:var(--navy);
    box-shadow:0 10px 24px -14px rgba(27,51,88,.35);
  }
  .vocab-card:focus-visible{
    outline:2px solid var(--navy);
    outline-offset:2px;
  }
  .card-icon{
    flex:none;
    width:44px;height:44px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .card-icon svg{width:22px;height:22px;}
  .card-word{
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    font-size:17px;
    color:var(--navy-deep);
    line-height:1.35;
  }
  .card-num{
    font-size:11px;
    color:var(--ink-soft);
    display:block;
    margin-bottom:2px;
  }

  /* color variants */
  .c-navy{background:var(--navy);color:#fff;}
  .c-amber{background:var(--amber);color:#fff;}
  .c-sage{background:var(--sage);color:#fff;}
  .c-brass{background:var(--brass);color:#fff;}

  /* ---------- DETAIL VIEW ---------- */
  #detailView{display:none;}

  .detail-topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    margin-bottom:22px;
  }
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:none;
    border:1px solid var(--line);
    color:var(--navy-deep);
    font-size:14px;
    font-weight:500;
    padding:9px 16px 9px 12px;
    border-radius:999px;
    cursor:pointer;
    font-family:inherit;
    transition:background .15s ease,border-color .15s ease;
  }
  .back-btn:hover{background:var(--paper-2);border-color:var(--navy);}

  .flags{
    display:flex;
    gap:8px;
    opacity:0;
    transform:translateY(-6px);
    pointer-events:none;
    transition:opacity .45s ease, transform .45s ease;
  }
  .flags.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .flag-btn{
    width:46px;height:46px;
    border-radius:50%;
    border:2px solid var(--card);
    background:var(--card);
    cursor:pointer;
    padding:0;
    overflow:hidden;
    box-shadow:0 4px 14px -6px rgba(27,51,88,.4);
    transition:transform .15s ease, border-color .15s ease;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    line-height:1;
  }
  .flag-btn:hover{transform:translateY(-2px) scale(1.05);}
  .flag-btn.active{border-color:var(--amber);}
  .flag-btn:focus-visible{outline:2px solid var(--navy);outline-offset:2px;}

  .detail-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    padding:clamp(28px,4vw,56px);
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:26px;
    min-height:60vh;
    justify-content:center;
  }

  .lang-tag{
    font-size:12.5px;
    letter-spacing:.02em;
    color:var(--ink-soft);
    border:1px solid var(--line);
    padding:5px 14px;
    border-radius:999px;
  }

  .detail-word{
    font-family:'Noto Serif KR',serif;
    font-weight:700;
    font-size:clamp(32px,5vw,56px);
    color:var(--navy-deep);
    line-height:1.2;
    margin:0;
  }
  .detail-word .ko-sub{
    display:block;
    font-family:'Noto Sans KR',sans-serif;
    font-weight:500;
    font-size:16px;
    color:var(--ink-soft);
    margin-top:8px;
  }

  .detail-image{
    width:150px;height:150px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .detail-image svg{width:76px;height:76px;}

  .detail-desc{
    max-width:560px;
    font-size:clamp(16px,2vw,19px);
    line-height:1.75;
    color:var(--ink);
    margin:0;
  }

  .replay-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--navy);
    color:#fff;
    border:none;
    font-size:14px;
    font-weight:500;
    padding:11px 20px;
    border-radius:999px;
    cursor:pointer;
    font-family:inherit;
    transition:background .15s ease, transform .15s ease;
  }
  .replay-btn:hover{background:var(--navy-deep);transform:translateY(-1px);}
  .replay-btn:disabled{opacity:.5;cursor:default;transform:none;}

  .speaking-note{
    font-size:12.5px;
    color:var(--ink-soft);
    min-height:16px;
  }

  .nav-row{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .nav-arrow{
    background:none;
    border:1px solid var(--line);
    color:var(--navy-deep);
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    font-family:inherit;
    font-size:13.5px;
    transition:background .15s ease,border-color .15s ease;
  }
  .nav-arrow:hover{background:var(--paper-2);border-color:var(--navy);}
  .nav-arrow:disabled{opacity:.4;cursor:default;}

  .no-speech-note{
    font-size:12.5px;
    color:var(--amber-deep);
    background:#FBF1E2;
    border:1px solid #EFD9AE;
    padding:8px 14px;
    border-radius:10px;
    display:none;
  }

  footer.site{
    padding:22px 6vw 40px;
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<header class="site">
  <div class="eyebrow-row">
    <span class="badge-dot"></span>
    <span class="kicker">초등 사회 · 정치와 선거 어휘 학습</span>
  </div>
  <h1 class="title">사회 교과서 어휘 학습</h1>
  <p class="lede">한자어 개념 때문에 어렵게 느껴지는 사회 어휘를, 그림과 소리로 쉽게 배워요. 한국어를 잘 모르는 친구들도 함께 배울 수 있도록 영어·러시아어·중국어를 지원합니다.</p>
</header>

<main>

  <!-- ===== GRID VIEW ===== -->
  <section id="gridView">
    <div class="grid-heading">
      <h2>목표 어휘 29개</h2>
      <span class="grid-count">단어를 눌러 뜻과 그림, 발음을 확인하세요</span>
    </div>
    <div class="vocab-grid" id="vocabGrid"></div>
  </section>

  <!-- ===== DETAIL VIEW ===== -->
  <section id="detailView">
    <div class="detail-topbar">
      <button class="back-btn" id="backBtn" aria-label="목록으로 돌아가기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        목록으로
      </button>
      <div class="flags" id="flagRow">
        <button class="flag-btn" data-lang="ko" aria-label="한국어" title="한국어">🇰🇷</button>
        <button class="flag-btn" data-lang="en" aria-label="English" title="English">🇺🇸</button>
        <button class="flag-btn" data-lang="ru" aria-label="Русский" title="Русский">🇷🇺</button>
        <button class="flag-btn" data-lang="zh" aria-label="中文" title="中文">🇨🇳</button>
      </div>
    </div>

    <div class="detail-card">
      <span class="lang-tag" id="langTag">한국어</span>

      <div class="detail-image" id="detailImage"></div>

      <h3 class="detail-word" id="detailWord" lang="ko"></h3>

      <p class="detail-desc" id="detailDesc" lang="ko"></p>

      <div>
        <button class="replay-btn" id="replayBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>
          <span id="replayLabel">다시 듣기</span>
        </button>
      </div>
      <p class="speaking-note" id="speakingNote"></p>
      <p class="no-speech-note" id="noSpeechNote">이 브라우저는 음성 재생을 지원하지 않아요. 텍스트로 뜻을 확인해 주세요.</p>

      <div class="nav-row">
        <button class="nav-arrow" id="prevBtn">← 이전 단어</button>
        <button class="nav-arrow" id="nextBtn">다음 단어 →</button>
      </div>
    </div>
  </section>

</main>

<footer class="site">국립국어원·다문화 학습 지원을 위한 사회과 어휘 학습 사이트 · 첨부 어휘 자료 기반 자동 생성</footer>

<script id="vocab-data" type="application/json">[{"id": 1, "ko": {"word": "정치", "desc": "사회 구성원 간의 대립과 갈등을 조정하여 문제를 해결하는 모든 과정입니다."}, "en": {"word": "Politics", "desc": "Politics is the entire process of resolving problems by mediating confrontations and conflicts among members of society."}, "ru": {"word": "Политика", "desc": "это весь процесс решения проблем путём регулирования противостояний и конфликтов между членами общества."}, "zh": {"word": "政治", "desc": "政治是调解社会成员之间的对立与冲突，并解决问题的全过程。"}}, {"id": 2, "ko": {"word": "정치 제도", "desc": "많은 사람이 모여 살다 보면 의견이 다를 때가 있죠? 이때 문제를 해결하고 질서를 지키기 위해 만든 사회의 운영 규칙입니다."}, "en": {"word": "Political System", "desc": "Operating rules for society created to resolve conflicts and maintain order when many people live together and have different opinions."}, "ru": {"word": "Политическая система", "desc": "Правила управления обществом, созданные для решения проблем и поддержания порядка, когда много людей живут вместе и имеют разные мнения."}, "zh": {"word": "政治制度", "desc": "许多人聚集在一起生活，难免会有意见分歧。这是为了解决这些问题并维持秩序而制定的社会运营规则。"}}, {"id": 3, "ko": {"word": "민주주의", "desc": "어떤 한 사람이 마음대로 결정하는 것이 아니라, 나라의 주인인 국민이 함께 뜻을 모아 나라를 다스리는 방식입니다."}, "en": {"word": "Democracy", "desc": "A way of ruling the country where the people, as masters, gather their thoughts together instead of one person making decisions arbitrarily."}, "ru": {"word": "Демократия", "desc": "Способ управления страной, при котором народ как хозяин принимает решения вместе, а не один человек по своему усмотрению."}, "zh": {"word": "民主主义", "desc": "不是由某个人随心所欲地做决定，而是由作为国家主人的国民共同集思广익来治理国家的方式。"}}, {"id": 4, "ko": {"word": "주권(국민 주권)", "desc": "가족의 중요한 일을 가족구성원이 정하듯, 나라의 중요한 일을 스스로 결정할 수 있는 주인의 힘입니다."}, "en": {"word": "Sovereignty (Popular ~)", "desc": "The power of a master to decide the important affairs of the country, just as family members decide important family matters."}, "ru": {"word": "Суверенитет (Народный ~)", "desc": "Власть хозяина самостоятельно принимать важные решения для страны, подобно тому как члены семьи решают важные семейные дела."}, "zh": {"word": "主权 (国民主权)", "desc": "就像家庭成员决定家庭大事一样，这是作为主人可以自主决定国家大事的力量。"}}, {"id": 5, "ko": {"word": "정책", "desc": "사람들이 더 안전하고 행복하게 살 수 있도록, 나라나 지역 사회가 어떤 문제를 해결하기 위해 세운 구체적인 계획과 약속입니다."}, "en": {"word": "Policy", "desc": "Specific plans and promises made by the state or local community to solve problems so that people can live more safely and happily."}, "ru": {"word": "Политика", "desc": "Конкретные планы и обещания, установленные государством или местным сообществом для решения проблем, чтобы люди могли жить в большей безопасности и счастье."}, "zh": {"word": "政策", "desc": "为了让人们生活得更安全、更幸福，国家或地方社会为解决某些问题而制定的具体计划和承诺。"}}, {"id": 6, "ko": {"word": "정책 반영", "desc": "우리들의 생각이나 요구가 나라나 학교의 실제 계획(정책) 속에 쏙 들어가는 것입니다."}, "en": {"word": "Policy Reflection", "desc": "When our ideas or demands are actually included in the official plans (policies) of the school or the country."}, "ru": {"word": "Отражение в политике", "desc": "Когда наши идеи или требования включаются в реальные планы (политику) школы или страны."}, "zh": {"word": "政策反映", "desc": "我们的想法或要求被纳入学校或国家的实际计划（政策）中。"}}, {"id": 7, "ko": {"word": "선거", "desc": "우리 모두가 한꺼번에 나랏일을 할 수 없으니, 우리를 대신해 일할 대표자를 투표로 뽑는 소중한 약속입니다."}, "en": {"word": "Election", "desc": "A precious promise to vote for a representative to work on our behalf, since we cannot all manage state affairs at once."}, "ru": {"word": "Выборы", "desc": "Важное обещание выбрать путем голосования представителя, который будет работать вместо нас, так как мы не можем все вместе заниматься делами"}, "zh": {"word": "选举", "desc": "因为我们无法同时处理国家事务，所以通过投票选举代表我们工作的代表，这是一个珍贵的约定。"}}, {"id": 8, "ko": {"word": "정당성", "desc": "정해진 규칙(선거 등)을 지켜서 뽑혔기 때문에, 모두가 인정할 수 있는 올바른 자격을 얻은 상태입니다."}, "en": {"word": "Legitimacy", "desc": "A state of having gained proper qualification that everyone can accept, because the person was elected by following set rules (such as elections)."}, "ru": {"word": "Легитимность", "desc": "Состояние получения надлежащей квалификации, которую все могут признать, потому что человек был выбран с соблюдением установленных правил (таких как выборы)."}, "zh": {"word": "正当性", "desc": "因为遵守了既定规则（如选举等）而被选中，从而获得大家都能认可的正当资格的状态。"}}, {"id": 9, "ko": {"word": "지지하다", "desc": "어떤 사람의 생각이나 계획이 옳다고 믿고 찬성하거나 응원하는 것입니다."}, "en": {"word": "Support (Endorse)", "desc": "Believing that someone’s thoughts or plans are right, and therefore agreeing with or cheering for them."}, "ru": {"word": "Поддерживать", "desc": "Вера в то, что чьи-то мысли или планы верны, и, следовательно, согласие с ними или их поддержка."}, "zh": {"word": "支持", "desc": "相信某个人的想法或计划是正确的，并表示赞成或支持。"}}, {"id": 10, "ko": {"word": "정치적 의사", "desc": "사회 문제나 나라 일에 대해 내가 가지고 있는 나만의 생각이나 의견입니다."}, "en": {"word": "Political Will / Opinion", "desc": "One's own unique thoughts or opinions regarding social issues or the affairs of the country."}, "ru": {"word": "Политическая воля", "desc": "Собственные уникальные мысли или мнения по поводу социальных проблем или дел страны."}, "zh": {"word": "政治意愿", "desc": "针对社会问题或国家事务，自己所持有的个人想法或意见。"}}, {"id": 11, "ko": {"word": "보통 선거", "desc": "성별, 재산, 학력에 상관없이 일정한 나이가 되면 누구나 투표할 수 있는 원칙입니다."}, "en": {"word": "Universal Suffrage", "desc": "The principle that anyone can vote once they reach a certain age, regardless of their gender, wealth, or education."}, "ru": {"word": "Всеобщее избирательное право", "desc": "Принцип, согласно которому каждый может голосовать по достижении определенного возраста, независимо от пола, имущества или образования."}, "zh": {"word": "普通选举", "desc": "无论性别、财产、学历如何，只要达到一定年龄，任何人都可以投票的原则。"}}, {"id": 12, "ko": {"word": "평등 선거", "desc": "모든 사람이 똑같이 한 표씩만 투표할 수 있는 것입니다."}, "en": {"word": "Equal Suffrage", "desc": "The principle that every person can cast exactly one vote, and each vote has the same value."}, "ru": {"word": "Равное избирательное право", "desc": "Принцип, согласно которому каждый человек может отдать только один голос, и каждый голос имеет одинаковую ценность."}, "zh": {"word": "平等选举", "desc": "每个人都平等地只能投出一票的原则。"}}, {"id": 13, "ko": {"word": "직접 선거", "desc": "내가 뽑고 싶은 사람을 내 손으로 직접 투표하는 것입니다."}, "en": {"word": "Direct Election", "desc": "Voting for the person you want to elect with your own hand, rather than through a representative."}, "ru": {"word": "Прямые выборы", "desc": "Личное голосование за кандидата, которого вы хотите выбрать, без посредников."}, "zh": {"word": "直接选举", "desc": "用自己的手直接投票给自己想选的人，而不是通过他人代投。"}}, {"id": 14, "ko": {"word": "비밀 선거", "desc": "내가 누구에게 투표했는지 다른 사람이 알 수 없게 비밀을 지켜주는 것입니다."}, "en": {"word": "Secret Ballot", "desc": "Keeping your vote a secret so that others cannot know who you voted for."}, "ru": {"word": "Тайное голосование", "desc": "Сохранение вашего голоса в тайне, чтобы другие не могли узнать, за кого вы проголосовали."}, "zh": {"word": "秘密选举", "desc": "保护投票秘密，不让别人知道你投给了谁。"}}, {"id": 15, "ko": {"word": "선거 관리 위원회", "desc": "선거가 규칙대로 공정하게 치러지도록 감시하고 관리하는 곳입니다."}, "en": {"word": "National Election Commission", "desc": "A body that monitors and manages elections to ensure they are conducted fairly and according to the rules."}, "ru": {"word": "Избирательная комиссия", "desc": "Орган, который контролирует и управляет выборами, чтобы они проходили честно и в соответствии с правилами."}, "zh": {"word": "选举管理委员会", "desc": "监督并管理选举，确保选举依法、公正进行的机构。"}}, {"id": 16, "ko": {"word": "정당", "desc": "정치적인 생각이 비슷한 사람들이 모여서 함께 나랏일을 하기 위해 만든 단체입니다."}, "en": {"word": "Political Party", "desc": "A group of people with similar political ideas who come together to participate in and manage the affairs of the country."}, "ru": {"word": "Политическая партия", "desc": "Группа людей с похожими политическими взглядами, объединившихся для совместного управления делами страны."}, "zh": {"word": "政党", "desc": "政治见解相似的人为了共同治理国家而组成的团体。"}}, {"id": 17, "ko": {"word": "유권자", "desc": "투표할 권리가 있는 사람(유권자)을 말합니다."}, "en": {"word": "Voter", "desc": "A person who has the legal right to vote in an election."}, "ru": {"word": "Избиратель", "desc": "Человек, имеющий законное право голоса на выборах."}, "zh": {"word": "有权者", "desc": "拥有投票权的合法公民。"}}, {"id": 18, "ko": {"word": "공약", "desc": "선거에 나온 후보자가 \"내가 당선되면 여러분을 위해 이런 일을 꼭 하겠습니다!\"\"라고 많은 사람 앞에서 공개적으로 하는 약속입니다."}, "en": {"word": "Election Pledge", "desc": "An election pledge is a public promise made by a candidate, saying, \"If I am elected, I will definitely do this for you!\""}, "ru": {"word": "Предвыборное обещание", "desc": "Предвыборное обещание — это публичное обязательство кандидата: «Если меня выберут, я обязательно сделаю это для вас!»"}, "zh": {"word": "公约", "desc": "竞选公约是候选人在大家面前公开做的承诺，意思是：“如果我当选了，我一定会为大家做这件事！”"}}, {"id": 19, "ko": {"word": "정책 제안", "desc": "우리가 겪는 불편함을 해결하거나 더 좋은 학교를 만들기 위해, \"이렇게 해보면 어떨까요?\"라고 구체적인 아이디어나 방법을 내놓는 것입니다."}, "en": {"word": "Policy Proposal", "desc": "It is coming up with specific ideas or methods, such as \"How about doing it this way?\" to solve inconveniences we face or to make a better school."}, "ru": {"word": "Предложение по политике", "desc": "Это выдвижение конкретных идей или методов, таких как «А что, если сделать вот так?», чтобы решить проблемы, с которыми мы сталкиваемся, или сделать школу лучше."}, "zh": {"word": "政策提案", "desc": "为了解决我们面临的不便或建设更好的学校，提出如“这样做怎么样？”之类的具体想法或方法。"}}, {"id": 20, "ko": {"word": "공공의 이익", "desc": "나 혼자만 좋은 것이 아니라, 우리 반 전체, 우리 학교 모두, 혹은 우리 동네 사람들 모두에게 도움이 되는 좋은 결과를 말합니다. 즉,  '모두의 행복'을 의미합니다."}, "en": {"word": "Common Good", "desc": "It refers to a good result that benefits not just me, but our entire class, our whole school, or everyone in our neighborhood. In other words, it means \"everyone's happiness.\""}, "ru": {"word": "Общественные интересы", "desc": "Это означает хороший результат, который приносит пользу не только мне одному, а всему нашему классу, всей школе или всем жителям нашего района. Другими словами, это «счастье для всех»."}, "zh": {"word": "公共利益", "desc": "这不仅是指对我个人有利，而是指对我们全班、全校或全社区的人都有帮助的好结果。换句话서，就是指“大家的幸福”。"}}, {"id": 21, "ko": {"word": "추구하다", "desc": "내가 중요하다고 생각하는 목적이나 가치를 이루기 위해 계속해서 노력하고 그 방향으로 나아가는 것입니다."}, "en": {"word": "Pursue", "desc": "It means continuously working and moving forward in a certain direction to achieve a goal or value that you consider important."}, "ru": {"word": "Стремиться / Преследовать", "desc": "Это значит постоянно работать и двигаться вперед в определенном направлении, чтобы достичь цели или ценности, которую вы считаете важной."}, "zh": {"word": "追求", "desc": "为了实现自己认为重要的目标或价值，不断努力并朝着那个方向前进。"}}, {"id": 22, "ko": {"word": "국회", "desc": "국민의 대표들이 모여 나라의 중요한 규칙(법)을 만들고, 나라 살림을 감시하는 곳입니다."}, "en": {"word": "National Assembly", "desc": "It is a place where representatives of the people gather to make important rules (laws) for the country and monitor the national budget and affairs."}, "ru": {"word": "Национальное собрание", "desc": "Это место, где собираются представители народа, чтобы принимать важные правила (законы) страны и следить за государственным бюджетом и делами."}, "zh": {"word": "国会", "desc": "这是国民代表聚集在一起制定国家重要规则（法律）并监督国家生活的地方。"}}, {"id": 23, "ko": {"word": "국회의원", "desc": "국민이 투표로 뽑은 국민의 심부름꾼으로 국민의 목소리를 나라에 전달합니다."}, "en": {"word": "Member of National Assembly", "desc": "They are \"servants of the people\" elected by vote, who deliver the voices of the citizens to the nation."}, "ru": {"word": "Депутат (Член Нац. собрания)", "desc": "Это «посланники народа», выбранные путем голосования, которые передают голос граждан государству."}, "zh": {"word": "国会议员", "desc": "他们是通过投票选出的“国民办事员”，负责将国民的声音传递给国家。"}}, {"id": 24, "ko": {"word": "국가기관", "desc": "나라를 안전하고 행복하게 만들기 위해 세워진 커다란 조직들을 말합니다. 국회, 정부, 법원 등이 모두 국가기관입니다."}, "en": {"word": "State Institution", "desc": "It refers to large organizations established to make the country safe and happy. The National Assembly, the Government, and the Courts are all national agencies."}, "ru": {"word": "Государственный орган", "desc": "Это крупные организации, созданные для того, чтобы сделать страну безопасной и счастливой. Национальное собрание, Правительство и Суды — все это государственные органы."}, "zh": {"word": "国家机关", "desc": "这是指为了让国家安全幸福而建立的大型组织。国会、政府、法院等都是国家机关。"}}, {"id": 25, "ko": {"word": "법률", "desc": "모든 국민이 지켜야 할 약속이자 규칙으로 국회에서 토론을 거쳐 만들어집니다."}, "en": {"word": "Law / Legislation", "desc": "It is a promise and rule that all citizens must follow, created through discussions in the National Assembly."}, "ru": {"word": "Закон", "desc": "Это обещание и правило, которое должны соблюдать все граждане; оно создается путем обсуждений в Национальном собрании."}, "zh": {"word": "法律", "desc": "这是全体国民都必须遵守的约定和规则，是通过国会讨论制定的。"}}, {"id": 26, "ko": {"word": "예산안 심의", "desc": "나라의 세금을 어디에, 얼마나 쓸지 미리 꼼꼼하게 따져보고 결정하는 일입니다."}, "en": {"word": "Budget Deliberation", "desc": "It is the process of carefully examining and deciding in advance where and how much of the country's taxes will be spent."}, "ru": {"word": "Рассмотрение бюджета", "desc": "Это процесс тщательного изучения и принятия решения о том, куда и сколько государственных налогов будет потрачено заранее."}, "zh": {"word": "预算案审议", "desc": "预先仔细考量并决定国家的税金将花在何处、花多少钱的工作。"}}, {"id": 27, "ko": {"word": "결산 심사", "desc": "나라의 돈을 다 쓴 뒤에 잘 썼는지 계획한 곳에 적절하게 사용했는지 확인하는 것입니다."}, "en": {"word": "Settlement Audit", "desc": "It is the process of checking whether the country's money was spent well and appropriately used as planned after all of it has been spent."}, "ru": {"word": "Аудит исполнения бюджета", "desc": "Это процесс проверки того, были ли государственные деньги потрачены правильно и по назначению после того, как все они были израсходованы."}, "zh": {"word": "决算审查", "desc": "在国家的钱全部花完后，确认是否花得当，以及是否按照计划用在了合适的地方。"}}, {"id": 28, "ko": {"word": "국정 감사", "desc": "정부가 나라 일을 잘못하고 있지는 않은지 국회가 조사하고 감시하는 일입니다."}, "en": {"word": "Government Audit", "desc": "It is the work of the National Assembly to investigate and monitor whether the government is doing its job correctly or making any mistakes."}, "ru": {"word": "Государственная ревизия", "desc": "Это работа Национального собрания по расследованию и контролю за тем, правильно ли правительство выполняет свою работу и не допускает ли оно ошибок."}, "zh": {"word": "国政监查", "desc": "这是指国会对政府是否在错误地处理国家事务进行调查和监督的工作。"}}, {"id": 29, "ko": {"word": "청문회", "desc": "높은 공무원이 될 사람이 그 일을 하기에 올바른 사람인지 국회에서 묻고 확인하는 회의입니다."}, "en": {"word": "Hearing", "desc": "It is a meeting in the National Assembly to ask and confirm if a person who is to become a high-ranking public official is the right person for the job."}, "ru": {"word": "Слушания", "desc": "Это собрание в Национальном собрании, чтобы спросить и подтвердить, является ли человек, который должен стать высокопоставленным чиновником, подходящим для этой работы."}, "zh": {"word": "听证会", "desc": "这是在国会询问并确认将要担任高级公务员的人是否是合适人选的会议。"}}]</script>
<script>
(function(){
  "use strict";

  var VOCAB = JSON.parse(document.getElementById('vocab-data').textContent);

  var LANG_META = {
    ko:{label:'한국어', code:'ko-KR', flagTitle:'한국어'},
    en:{label:'English', code:'en-US', flagTitle:'English'},
    ru:{label:'Русский', code:'ru-RU', flagTitle:'Русский'},
    zh:{label:'中文', code:'zh-CN', flagTitle:'中文'}
  };

  // ---------- Icon library (single-color line icons, currentColor) ----------
  var ICONS = {
    speech: '<path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>',
    orgchart: '<path d="M12 3v6M6 21v-4a2 2 0 012-2h8a2 2 0 012 2v4"/><circle cx="12" cy="9" r="3"/><circle cx="6" cy="21" r="0.1"/><path d="M4 21h4M16 21h4"/>',
    people: '<path d="M17 21v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>',
    crown: '<path d="M2 18h20l-2-9-5 4-3-7-3 7-5-4-2 9z"/><path d="M4 21h16"/>',
    docCheck: '<path d="M14 3v4a1 1 0 001 1h4"/><path d="M17 21H7a2 2 0 01-2-2V5a2 2 0 012-2h7l5 5v11a2 2 0 01-2 2z"/><path d="M9 14l2 2 4-4"/>',
    docArrow: '<path d="M14 3v4a1 1 0 001 1h4"/><path d="M17 21H7a2 2 0 01-2-2V5a2 2 0 012-2h7l5 5v11a2 2 0 01-2 2z"/><path d="M9 15h6M12 12l3 3-3 3"/>',
    ballot: '<rect x="3" y="9" width="18" height="12" rx="1"/><path d="M8 9V6a4 4 0 018 0v3"/><path d="M12 13v4M9.5 15.5h5"/>',
    badgeCheck: '<circle cx="12" cy="9" r="6"/><path d="M9 9l2 2 4-4"/><path d="M8.5 14.5L7 21l5-2 5 2-1.5-6.5"/>',
    thumbsUp: '<path d="M7 10v11"/><path d="M11 21h6a2 2 0 002-2v-6a2 2 0 00-2-2h-3l1-5a2 2 0 00-2-2l-4 6v10a2 2 0 002 1z"/>',
    scale: '<path d="M12 3v18M7 21h10"/><path d="M5 7l-3 6a3 3 0 006 0l-3-6z"/><path d="M19 7l-3 6a3 3 0 006 0l-3-6z"/><path d="M5 7h14M12 3l7 4M12 3L5 7"/>',
    voteHand: '<path d="M12 2v10"/><path d="M8 6l4-4 4 4"/><rect x="3" y="12" width="18" height="9" rx="1"/><path d="M12 16v2"/>',
    envelope: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 7l9 6 9-6"/><circle cx="17" cy="16" r="3"/><path d="M17 15v1.3l.9.7"/>',
    magnifierDoc: '<path d="M14 3v4a1 1 0 001 1h4"/><path d="M17 21H7a2 2 0 01-2-2V5a2 2 0 012-2h7l5 5v3"/><circle cx="12.5" cy="15.5" r="3.5"/><path d="M15 18l2.5 2.5"/>',
    megaphone: '<path d="M3 11v3a1 1 0 001 1h2l3 5v-6"/><path d="M9 10L20 5v13L9 13"/><path d="M20 9a3 3 0 010 5"/>',
    lightbulbDoc: '<path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 00-3 11.2c.6.4 1 1.1 1 1.8h4c0-.7.4-1.4 1-1.8A6 6 0 0012 3z"/>',
    heartPeople: '<path d="M12.1 8.6c-1-2-3.6-2.7-5.2-1.1-1.7 1.7-1.5 4.3.3 6l4.9 4.5 4.9-4.5c1.8-1.7 2-4.3.3-6-1.6-1.6-4.2-.9-5.2 1.1z"/>',
    targetArrow: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    building: '<path d="M4 21V9l8-6 8 6v12"/><path d="M4 21h16"/><path d="M9 21v-6h6v6"/><path d="M9 12h.01M15 12h.01M9 8.5h.01M15 8.5h.01"/>',
    gavel: '<path d="M14 10l-7.5 7.5"/><path d="M17.5 6.5l-4-4L9 7l4 4z"/><path d="M12.5 9.5l4 4L20 10l-4-4z"/><path d="M3 21h9"/>',
    micPeople: '<rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0014 0"/><path d="M12 17v4"/><path d="M9 21h6"/>'
  };

  // ---------- Word -> icon / color assignment ----------
  var ASSIGN = [
    {icon:'speech', color:'navy'},      // 1 정치
    {icon:'orgchart', color:'navy'},    // 2 정치 제도
    {icon:'people', color:'sage'},      // 3 민주주의
    {icon:'crown', color:'navy'},       // 4 주권
    {icon:'docCheck', color:'brass'},   // 5 정책
    {icon:'docArrow', color:'brass'},   // 6 정책 반영
    {icon:'ballot', color:'amber'},     // 7 선거
    {icon:'badgeCheck', color:'navy'},  // 8 정당성
    {icon:'thumbsUp', color:'sage'},    // 9 지지하다
    {icon:'speech', color:'sage'},      // 10 정치적 의사
    {icon:'people', color:'amber'},     // 11 보통 선거
    {icon:'scale', color:'amber'},      // 12 평등 선거
    {icon:'voteHand', color:'amber'},   // 13 직접 선거
    {icon:'envelope', color:'amber'},   // 14 비밀 선거
    {icon:'magnifierDoc', color:'amber'}, // 15 선거관리위원회
    {icon:'people', color:'navy'},      // 16 정당
    {icon:'voteHand', color:'amber'},   // 17 유권자
    {icon:'megaphone', color:'brass'},  // 18 공약
    {icon:'lightbulbDoc', color:'brass'}, // 19 정책 제안
    {icon:'heartPeople', color:'sage'}, // 20 공공의 이익
    {icon:'targetArrow', color:'sage'}, // 21 추구하다
    {icon:'building', color:'navy'},    // 22 국회
    {icon:'voteHand', color:'navy'},    // 23 국회의원
    {icon:'orgchart', color:'navy'},    // 24 국가기관
    {icon:'gavel', color:'navy'},       // 25 법률
    {icon:'magnifierDoc', color:'brass'}, // 26 예산안 심의
    {icon:'magnifierDoc', color:'brass'}, // 27 결산 심사
    {icon:'magnifierDoc', color:'navy'}, // 28 국정 감사
    {icon:'micPeople', color:'navy'}    // 29 청문회
  ];

  function iconSvg(name, size){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONS[name]+'</svg>';
  }

  // ---------- Build grid ----------
  var gridEl = document.getElementById('vocabGrid');
  VOCAB.forEach(function(item, idx){
    var meta = ASSIGN[idx] || {icon:'speech', color:'navy'};
    var card = document.createElement('button');
    card.className = 'vocab-card';
    card.setAttribute('data-idx', idx);
    card.innerHTML =
      '<span class="card-icon c-'+meta.color+'">'+iconSvg(meta.icon)+'</span>'+
      '<span><span class="card-num">'+(idx+1)+'</span><span class="card-word">'+item.ko.word+'</span></span>';
    card.addEventListener('click', function(){ openDetail(idx); });
    gridEl.appendChild(card);
  });

  // ---------- View switching ----------
  var gridView = document.getElementById('gridView');
  var detailView = document.getElementById('detailView');
  var currentIdx = 0;
  var currentLang = 'ko';

  function openDetail(idx){
    currentIdx = idx;
    currentLang = 'ko';
    gridView.style.display = 'none';
    detailView.style.display = 'block';
    window.scrollTo({top:0, behavior:'smooth'});
    renderDetail(true);
  }

  document.getElementById('backBtn').addEventListener('click', function(){
    stopSpeech();
    detailView.style.display = 'none';
    gridView.style.display = 'block';
  });

  document.getElementById('prevBtn').addEventListener('click', function(){
    currentIdx = (currentIdx - 1 + VOCAB.length) % VOCAB.length;
    currentLang = 'ko';
    renderDetail(true);
  });
  document.getElementById('nextBtn').addEventListener('click', function(){
    currentIdx = (currentIdx + 1) % VOCAB.length;
    currentLang = 'ko';
    renderDetail(true);
  });

  // ---------- Speech synthesis ----------
  var speechSupported = ('speechSynthesis' in window);
  var voicesCache = [];
  function loadVoices(){
    if(!speechSupported) return;
    voicesCache = window.speechSynthesis.getVoices();
  }
  if(speechSupported){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  } else {
    document.getElementById('noSpeechNote').style.display = 'block';
  }

  function pickVoice(langCode){
    if(!voicesCache || !voicesCache.length) return null;
    var exact = voicesCache.filter(function(v){ return v.lang === langCode; });
    if(exact.length) return exact[0];
    var prefix = langCode.split('-')[0];
    var loose = voicesCache.filter(function(v){ return v.lang && v.lang.indexOf(prefix) === 0; });
    if(loose.length) return loose[0];
    return null;
  }

  function stopSpeech(){
    if(speechSupported) window.speechSynthesis.cancel();
    document.getElementById('speakingNote').textContent = '';
  }

  function speak(text, langCode, onDone){
    if(!speechSupported){ onDone && onDone(); return; }
    window.speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = langCode;
    var v = pickVoice(langCode);
    if(v) utter.voice = v;
    utter.rate = 0.92;
    utter.pitch = 1;
    var note = document.getElementById('speakingNote');
    note.textContent = '🔊 음성 재생 중…';
    utter.onend = function(){ note.textContent = ''; onDone && onDone(); };
    utter.onerror = function(){ note.textContent = ''; onDone && onDone(); };
    window.speechSynthesis.speak(utter);
  }

  // ---------- Render detail ----------
  var flagRow = document.getElementById('flagRow');
  var langTag = document.getElementById('langTag');
  var detailImage = document.getElementById('detailImage');
  var detailWord = document.getElementById('detailWord');
  var detailDesc = document.getElementById('detailDesc');
  var replayBtn = document.getElementById('replayBtn');

  Array.prototype.forEach.call(flagRow.querySelectorAll('.flag-btn'), function(btn){
    btn.addEventListener('click', function(){
      currentLang = btn.getAttribute('data-lang');
      renderDetail(false);
    });
  });

  replayBtn.addEventListener('click', function(){
    var item = VOCAB[currentIdx];
    var langData = item[currentLang];
    var meta = LANG_META[currentLang];
    speak(langData.word + '. ' + langData.desc, meta.code);
  });

  function setActiveFlag(){
    Array.prototype.forEach.call(flagRow.querySelectorAll('.flag-btn'), function(btn){
      btn.classList.toggle('active', btn.getAttribute('data-lang') === currentLang);
    });
  }

  function renderDetail(autoPlayKoreanThenReveal){
    var item = VOCAB[currentIdx];
    var meta = ASSIGN[currentIdx] || {icon:'speech', color:'navy'};
    var langData = item[currentLang];
    var langMeta = LANG_META[currentLang];

    detailImage.className = 'detail-image c-' + meta.color;
    detailImage.innerHTML = iconSvg(meta.icon);

    detailWord.setAttribute('lang', currentLang === 'zh' ? 'zh' : (currentLang === 'ru' ? 'ru' : (currentLang === 'en' ? 'en' : 'ko')));
    detailDesc.setAttribute('lang', detailWord.getAttribute('lang'));

    langTag.textContent = (currentIdx+1) + ' / ' + VOCAB.length + ' · ' + langMeta.label;

    if(currentLang === 'ko'){
      detailWord.innerHTML = langData.word;
    } else {
      detailWord.innerHTML = langData.word + '<span class="ko-sub">' + item.ko.word + '</span>';
    }
    detailDesc.textContent = langData.desc;

    setActiveFlag();

    if(autoPlayKoreanThenReveal){
      flagRow.classList.remove('show');
      speak(item.ko.word + '. ' + item.ko.desc, LANG_META.ko.code, function(){
        flagRow.classList.add('show');
      });
    } else {
      // language already unlocked; just play requested language, keep flags visible
      flagRow.classList.add('show');
      speak(langData.word + '. ' + langData.desc, langMeta.code);
    }
  }

})();
</script>
</body>
</html>
